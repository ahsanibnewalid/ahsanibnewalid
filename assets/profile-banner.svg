    <rect x="134" width="144" height="34" rx="17" fill="#0f172a" stroke="#334155"/><text x="206" y="22" fill="#c4b5fd" text-anchor="middle">Full-stack</text>
    <rect x="290" width="148" height="34" rx="17" fill="#0f172a" stroke="#334155"/><text x="364" y="22" fill="#86efac" text-anchor="middle">Automation</text>
    <rect x="450" width="132" height="34" rx="17" fill="#0f172a" stroke="#334155"/><text x="516" y="22" fill="#fcd34d" text-anchor="middle">Security</text>
