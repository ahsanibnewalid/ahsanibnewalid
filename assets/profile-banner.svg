  <text x="100" y="177" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Ahsan Ibne Walid</text>
  <text x="103" y="220" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Building useful software from Linux tools to full-stack platforms.</text>
