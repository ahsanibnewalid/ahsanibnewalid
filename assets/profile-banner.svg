<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Ahsan Ibne Walid — Software Developer</title>
  <desc id="desc">A high-contrast editorial developer banner with a warm paper background, bold typography, code motif, and green accent.</desc>
  <defs>
    <pattern id="paperGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#17221b" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2f5d43" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" fill="#f3f0e7"/>
  <rect width="1200" height="380" fill="url(#paperGrid)"/>
  <rect x="0" y="0" width="18" height="380" fill="#2f6b4f"/>
  <path d="M810 0H1200V380H920Z" fill="#e6e4d9"/>
  <path d="M890 0H1200V380H1040Z" fill="url(#dots)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="54" font-size="15" letter-spacing="3" fill="#2f6b4f">INDEPENDENT DEVELOPER / PORTFOLIO</text>
    <line x1="70" y1="75" x2="720" y2="75" stroke="#24372b" stroke-opacity=".35"/>
    <text x="66" y="153" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-2" fill="#18231c">Ahsan Ibne Walid</text>
    <text x="72" y="198" font-size="20" fill="#34483a">Software, systems &amp; useful tools.</text>
    <rect x="70" y="237" width="135" height="37" rx="2" fill="#2f6b4f"/>
    <text x="137.5" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LINUX / SYSTEMS</text>
    <rect x="216" y="237" width="126" height="37" rx="2" fill="#18231c"/>
    <text x="279" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#f3f0e7">WEB / FULL-STACK</text>
    <rect x="353" y="237" width="135" height="37" rx="2" fill="#e0e8dc" stroke="#2f6b4f"/>
    <text x="420.5" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6b4f">TOOLS / AUTOMATION</text>
    <text x="72" y="333" font-size="13" letter-spacing="1.5" fill="#536257">IDEAS → IMPLEMENTATION → ITERATION</text>
  </g>
  <g transform="translate(824 75)">
    <rect width="300" height="220" fill="#18231c"/>
    <rect width="300" height="34" fill="#27382c"/>
    <circle cx="19" cy="17" r="4" fill="#e6b85c"/>
    <circle cx="34" cy="17" r="4" fill="#d77b68"/>
    <circle cx="49" cy="17" r="4" fill="#79a887"/>
    <text x="68" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#d7e0d6">build-notes.md</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="20" y="68" fill="#8ba994">01</text><text x="51" y="68" fill="#f3f0e7">understand(problem)</text>
      <text x="20" y="98" fill="#8ba994">02</text><text x="51" y="98" fill="#f3f0e7">design(solution)</text>
      <text x="20" y="128" fill="#8ba994">03</text><text x="51" y="128" fill="#f3f0e7">build(iteratively)</text>
      <text x="20" y="158" fill="#8ba994">04</text><text x="51" y="158" fill="#f3f0e7">test + document</text>
      <text x="20" y="188" fill="#8ba994">05</text><text x="51" y="188" fill="#a8d6ae">return better;</text>
    </g>
  </g>
  <text x="824" y="326" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#2f6b4f">MAKE IT WORK. MAKE IT CLEAR.</text>
  <text x="1126" y="355" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#6b756b">GITHUB / PROFILE</text>
</svg>